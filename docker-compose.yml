services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: triageflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    expose:
      - "5432"
    volumes:
      - triageflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d triageflow"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      triageflow_net:
        aliases:
          - db

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/triageflow?schema=public&connect_timeout=10
      JWT_SECRET: local-docker-secret-change-me
      JWT_EXPIRES_IN: 1h
    ports:
      - "3000:3000"
    restart: on-failure
    networks:
      - triageflow_net
    command: >
      sh -c '
        echo "Resolving database host...";
        getent hosts db || true;
        until node -e "const net=require("net"); const s=net.createConnection({host:"db",port:5432},()=>{s.end();process.exit(0)}); s.on("error",()=>process.exit(1)); setTimeout(()=>process.exit(1),2000);"; do
          echo "Waiting for TCP connection to db:5432...";
          sleep 2;
        done;
        until npx prisma migrate deploy; do
          echo "Database reachable but Prisma migration failed; retrying in 2s...";
          sleep 2;
        done;
        node dist/src/server.js
      '

networks:
  triageflow_net:
    driver: bridge

volumes:
  triageflow_pgdata:
