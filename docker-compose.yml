services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: triageflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    expose:
      - "5432"
    volumes:
      - triageflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d triageflow"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      triageflow_net:
        aliases:
          - db

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DATABASE_URL: postgresql://postgres:postgres@db:5432/triageflow?schema=public&connect_timeout=10
      JWT_SECRET: local-docker-secret-change-me
      JWT_EXPIRES_IN: 1h
    ports:
      - "3000:3000"
    restart: on-failure
    networks:
      - triageflow_net
    command: >
      sh -c "
        node scripts/wait-for-db.js &&
        npx prisma migrate deploy &&
        node dist/src/server.js
      "

networks:
  triageflow_net:
    driver: bridge

volumes:
  triageflow_pgdata:
