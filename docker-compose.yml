services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: triageflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - triageflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d triageflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/triageflow?schema=public
      JWT_SECRET: local-docker-secret-change-me
      JWT_EXPIRES_IN: 1h
    ports:
      - "3000:3000"
    command: sh -c "npx prisma migrate deploy && node dist/src/server.js"

volumes:
  triageflow_pgdata:
